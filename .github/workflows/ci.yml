name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        os: [ubuntu-latest]
        include:
          - php: '8.2'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, fileinfo, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint (phpcs)
        run: composer lint

      - name: Analyse (phpstan)
        run: composer analyse

      - name: Test (phpunit)
        run: composer test -- --no-coverage

  dogfood:
    name: Self-scan (the tool checks its own source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, json
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Self-scan
        run: >
          php bin/wp-check . --path=src --path=config --path=bin
          --only=custom --fail-on=warning --no-cache --ignore=EOL_COMPONENT
          --format=console
